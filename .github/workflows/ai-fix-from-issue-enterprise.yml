# Triggered when an issue gets the ai-fix label, someone comments /fix-ai, or dispatched directly.
# Uses Copilot CLI in agent mode — the agent reads files, writes fixes, and verifies the build itself.

name: AI Fix from GitHub Issue (Enterprise)

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub issue number to fix'
        required: true

env:
  COPILOT_MODEL: gpt-4.1

concurrency:
  group: ai-fix-issue-enterprise-${{ github.event.inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  ai-fix:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-fix') ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/fix-ai') &&
       !github.event.issue.pull_request)

    permissions:
      contents: write
      issues: write
      pull-requests: write
      models: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Check dependencies
        run: |
          if ! command -v jq &>/dev/null; then
            sudo apt-get install -y -qq jq
          fi
          jq --version

      - name: Acknowledge trigger (add 👀 reaction)
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -d '{"content":"eyes"}' > /dev/null

      - name: Fetch issue details and build agent prompt
        id: issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUMBER="${{ github.event.inputs.issue_number }}"
          else
            ISSUE_NUMBER="${{ github.event.issue.number }}"
          fi

          ISSUE_JSON=$(curl -s \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${ISSUE_NUMBER}")

          ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.title // "Untitled"')
          ISSUE_BODY=$(echo "$ISSUE_JSON"  | jq -r '.body  // "No description."')
          JIRA_KEY=$(echo "$ISSUE_BODY" | grep -oP '(?<=<!-- jira-key: )[A-Z][A-Z0-9]*-[0-9]+(?= -->)' || true)
          ISSUE_TYPE=$(echo "$ISSUE_BODY" | grep -i '| \*\*Type\*\*' | grep -oP '(?<=\| )[A-Za-z ]+(?= \|?\s*$)' | xargs || echo "Task")

          echo "number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "title=$ISSUE_TITLE"   >> $GITHUB_OUTPUT
          echo "jira_key=$JIRA_KEY"   >> $GITHUB_OUTPUT

          # Derive commit type from issue type
          case "$(echo "$ISSUE_TYPE" | tr '[:upper:]' '[:lower:]')" in
            *bug*)           COMMIT_TYPE="fix"      ; TYPE_GUIDANCE="This is a BUG fix. Make the minimal change that corrects the broken behaviour. Do not refactor surrounding code." ;;
            *story*|*feat*)  COMMIT_TYPE="feat"     ; TYPE_GUIDANCE="This is a FEATURE request. Implement the new capability while preserving all existing behaviour." ;;
            *refactor*)      COMMIT_TYPE="refactor" ; TYPE_GUIDANCE="This is a REFACTOR. Restructure code without changing any behaviour." ;;
            *doc*)           COMMIT_TYPE="docs"     ; TYPE_GUIDANCE="This is a DOCUMENTATION update. Only update comments or docs, not logic." ;;
            *test*)          COMMIT_TYPE="test"     ; TYPE_GUIDANCE="This is a TEST task. Add or update tests only." ;;
            *)               COMMIT_TYPE="fix"      ; TYPE_GUIDANCE="Implement the changes described in the issue with minimal impact on unrelated code." ;;
          esac
          echo "commit_type=$COMMIT_TYPE" >> $GITHUB_OUTPUT

          # Write the agent task prompt
          {
            echo "You are an expert software engineer. Fix the GitHub issue below."
            echo ""
            echo "Repository: ${{ github.repository }}"
            echo "Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
            echo "Issue type: ${ISSUE_TYPE} — ${TYPE_GUIDANCE}"
            echo ""
            echo "## Issue Description"
            echo "${ISSUE_BODY}"
            echo ""
            echo "## Instructions"
            echo "The repository is already checked out in the current working directory."
            echo ""
            echo "1. Start by running: find . -name 'package.json' -not -path '*/node_modules/*'"
            echo "   to locate ALL projects in this repository. Identify which subdirectory contains"
            echo "   the frontend and which contains the backend. ALL file changes must target the"
            echo "   correct subdirectory — never assume it is called 'frontend/', check first."
            echo "   Then explore the relevant project to understand its structure, naming conventions,"
            echo "   how similar features are implemented, and what packages are available."
            echo "2. Implement the fix following the existing code style exactly."
            echo "3. Only change what is needed — preserve all existing functionality."
            echo "4. Always prefer modifying an existing file over creating a new one."
            echo "5. If you create a new component, import and use it in the relevant parent file."
            echo "6. Never import a package that is not in package.json."
            echo "7. After making changes, verify the build compiles (run npm install && npm run build"
            echo "   in the project directory). If the build fails, fix the errors before finishing."
            echo "8. Do NOT create a git commit — only make the file changes."
            echo ""
            echo "## Critical checks before finishing"
            echo "- Read every file you import or reference. If a file exists but contains only a stub,"
            echo "  placeholder, or empty component (e.g. just 'export default function X() { return null }'),"
            echo "  you MUST implement it fully — do not leave stubs behind."
            echo "- If the issue asks for a new page or feature, verify it actually renders meaningful content,"
            echo "  not just an empty shell. Check that data is fetched, displayed, and any required actions"
            echo "  (e.g. add to cart) are wired up."
            echo "- Look at similar existing pages/components in the codebase and follow the same patterns"
            echo "  for API calls, state management, and styling."
            echo "- A route that points to a blank component is not a fix — the component must be complete."
            echo ""
            echo "## Ruleset"
            echo ""
            echo "Never overwrite a file with a stub:"
            echo "- When modifying an existing file, READ it fully first, then make targeted changes."
            echo "  NEVER replace an existing file's contents with a minimal stub or skeleton."
            echo "  If a file has 300 lines, your edit must preserve all 300 lines and only add/change"
            echo "  what the issue requires. Deleting unrelated code is not allowed."
            echo ""
            echo "Do not touch routing or entry-point files unless explicitly required:"
            echo "- NEVER modify App.tsx, main.tsx, index.tsx, or any router configuration file"
            echo "  unless the issue explicitly asks for routing changes."
            echo "- If a route for the page already exists in App.tsx, leave App.tsx completely untouched."
            echo "- Implementing a page component means editing only that component file (and any new"
            echo "  files it needs). The router, providers, and layout are already wired up."
            echo ""
            echo "UI reachability:"
            echo "- If you add a new page, make sure users can actually reach it from the UI."
            echo "  Check where the entry point should be (e.g. a product card, a nav link, a button)"
            echo "  and add the link or navigation call there. A page that exists but cannot be"
            echo "  reached by clicking anything in the UI is not done."
            echo ""
            echo "No hardcoded data:"
            echo "- Never mock or hardcode data that should come from the backend."
            echo "  Check what API endpoints exist (look at existing fetch/axios calls in the codebase)"
            echo "  and use those. If an endpoint does not exist yet, note it in a code comment but"
            echo "  still wire up the frontend call so it is ready when the endpoint is added."
            echo ""
            echo "No debug leftovers:"
            echo "- Remove all console.log, console.error, console.warn, TODO, FIXME, and HACK"
            echo "  comments before finishing. Do not leave any debug or temporary code behind."
            echo ""
            echo "Auth pattern:"
            echo "- Check how existing protected pages handle authentication (e.g. route guards,"
            echo "  useAuth hook, redirect to login). Apply exactly the same pattern to any new"
            echo "  page or feature you add. Never leave a page unprotected if similar pages are protected."
            echo ""
            echo "Reuse existing utilities:"
            echo "- Before writing any new hook, helper, or utility function, search the codebase"
            echo "  for an existing one that does the same thing (e.g. useCart, useAuth, api.ts)."
            echo "  Use the existing utility. Only create a new one if nothing equivalent exists."
            echo ""
            echo "Type safety:"
            echo "- Before importing ANY type from a shared types file (e.g. types.ts, models.ts),"
            echo "  READ that file first and confirm the type is actually exported from it."
            echo "  Never import a type you have not seen with your own eyes in that file."
            echo "- Before accessing a property on a typed object (e.g. product.stock, cart.items),"
            echo "  read the type definition and confirm the property exists on that type."
            echo "- If a type is missing a field you need, ADD the field to the type definition"
            echo "  rather than assuming it exists. Keep the type and all usages consistent."
            echo "- Never use 'any' as a type — use or extend existing types."
            echo "- After ALL changes are made, run the build and fix every TypeScript error"
            echo "  before considering the task done."
          } > /tmp/agent-prompt.txt

          echo "Agent prompt written ($(wc -l < /tmp/agent-prompt.txt) lines)"

      - name: Cache Copilot CLI
        uses: actions/cache@v4
        id: cache-copilot
        with:
          path: ~/.local/bin
          key: copilot-cli-${{ runner.os }}

      - name: Install Copilot CLI
        if: steps.cache-copilot.outputs.cache-hit != 'true'
        run: curl -fsSL https://gh.io/copilot-install | bash

      - name: Run Copilot agent
        id: ai_fix
        timeout-minutes: 60
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          copilot -p "$(cat /tmp/agent-prompt.txt)" \
            --model "$COPILOT_MODEL" \
            --no-ask-user \
            2>&1 | tee /tmp/copilot-output.log || true

          COPILOT_EXIT=${PIPESTATUS[0]}
          # 141 = SIGPIPE from head -c truncation — not a real failure
          if [ "$COPILOT_EXIT" -ne 0 ] && [ "$COPILOT_EXIT" -ne 141 ]; then
            echo "::error::Copilot CLI failed — check COPILOT_PAT secret and model name"
            exit 1
          fi

          echo "=== Copilot agent output ==="
          cat /tmp/copilot-output.log

      - name: Check for changes
        id: check_changes
        run: |
          CHANGED=$(git diff --name-only)
          UNTRACKED=$(git ls-files --others --exclude-standard)

          if [ -z "$CHANGED" ] && [ -z "$UNTRACKED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No file changes produced by the agent."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "=== Modified files ==="
            echo "$CHANGED"
            echo "=== New files ==="
            echo "$UNTRACKED"

            # Derive scope from first folder segment of changed files
            SCOPE=$(printf '%s\n%s' "$CHANGED" "$UNTRACKED" \
              | grep '/' | sed 's|/.*||' | sort -u | head -1)
            [ -z "$SCOPE" ] && SCOPE="jira-ai"
            echo "scope=$SCOPE" >> $GITHUB_OUTPUT

            # Build analysis summary from changed files
            ALL_CHANGED=$(printf '%s\n%s' "$CHANGED" "$UNTRACKED" \
              | grep -v '^$' | awk '{printf "- `%s`\n", $0}')
            echo "AI agent applied changes to fix the issue." > /tmp/ai_analysis.txt
            echo "" >> /tmp/ai_analysis.txt
            echo "$ALL_CHANGED" >> /tmp/ai_analysis.txt
          fi

      - name: Create pull request with AI fixes
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_pr
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          JIRA_DOMAIN: ${{ vars.JIRA_DOMAIN }}
        run: |
          git config --global user.name "AI Issue Fixer"
          git config --global user.email "ai-fixer@github.com"

          JIRA_KEY="${{ steps.issue.outputs.jira_key }}"
          COMMIT_TYPE="${{ steps.issue.outputs.commit_type }}"
          SCOPE="${{ steps.check_changes.outputs.scope }}"

          if [ -z "$JIRA_KEY" ]; then
            echo "❌ No Jira key found in issue body — cannot create branch"
            exit 1
          fi

          BRANCH="feature/${JIRA_KEY}"
          git checkout -b "$BRANCH"
          git add -A

          ANALYSIS=$(cat /tmp/ai_analysis.txt 2>/dev/null || echo "AI-generated code changes")
          COMMIT_MSG=$(printf '%s(%s): AI-generated fix for issue #%s\n\nFixes #%s\nJira: %s\n\n%s' \
            "$COMMIT_TYPE" "$SCOPE" "$ISSUE_NUMBER" "$ISSUE_NUMBER" "$JIRA_KEY" "$ANALYSIS")
          git commit -m "$COMMIT_MSG"

          git push origin --delete "$BRANCH" 2>/dev/null || true
          git push --force origin "$BRANCH"

          CLEAN_TITLE=$(echo "$ISSUE_TITLE" | sed 's/^\[[A-Z][A-Z0-9]*-[0-9]\+\][[:space:]]*//')
          PR_TITLE="${COMMIT_TYPE}(${SCOPE}): ${JIRA_KEY} - ${CLEAN_TITLE}"
          CHANGED_FILES=$(git diff --name-only HEAD~1 2>/dev/null | awk 'NF{printf "- `%s`\n", $0}')
          JIRA_DOMAIN_CLEAN="${JIRA_DOMAIN%/}"

          JIRA_LINE=""
          if [ -n "$JIRA_KEY" ] && [ -n "$JIRA_DOMAIN_CLEAN" ]; then
            JIRA_LINE="**Jira:** [${JIRA_KEY}](https://${JIRA_DOMAIN_CLEAN}/browse/${JIRA_KEY})"
          elif [ -n "$JIRA_KEY" ]; then
            JIRA_LINE="**Jira:** ${JIRA_KEY}"
          fi

          PR_BODY=$(jq -rn \
            --arg issue    "$ISSUE_NUMBER" \
            --arg jira     "$JIRA_LINE" \
            --arg analysis "$ANALYSIS" \
            --arg changed  "$CHANGED_FILES" \
            --arg jira_key "$JIRA_KEY" \
            --arg title    "$CLEAN_TITLE" \
            --arg model    "$COPILOT_MODEL" \
            '(if $jira_key != "" then "## 🤖 AI-Generated Fix — Refs:" + $jira_key + " - " + $title else "## 🤖 AI-Generated Fix" end) +
             "\n\n**GitHub issue:** #" + $issue + "\n**AI provider:** GitHub Copilot agent (" + $model + ")" +
             (if $jira != "" then "\n" + $jira else "" end) +
             "\n\n### Analysis\n" + $analysis +
             "\n\n### Changed Files\n" + $changed +
             "\n\n---\nFixes #" + $issue +
             (if $jira_key != "" then "\nRefs: " + $jira_key else "" end) +
             (if $jira_key != "" then "\n<!-- jira-key: " + $jira_key + " -->" else "" end)')

          PR_BODY_JSON=$(printf '%s' "$PR_BODY" | jq -Rs '.')
          PR_TITLE_JSON=$(printf '%s' "$PR_TITLE" | jq -Rs '.')

          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{\"title\": ${PR_TITLE_JSON}, \"body\": ${PR_BODY_JSON}, \"head\": \"${BRANCH}\", \"base\": \"${{ github.event.repository.default_branch }}\"}")

          PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number // empty')
          PR_URL=$(echo "$PR_RESPONSE"    | jq -r '.html_url // empty')

          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_url=$PR_URL"       >> $GITHUB_OUTPUT
          echo "✅ PR #${PR_NUMBER} created: $PR_URL"

      - name: Comment on issue with PR link
        if: steps.create_pr.outputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ANALYSIS=$(cat /tmp/ai_analysis.txt 2>/dev/null || echo "See PR for details.")
          JIRA_KEY="${{ steps.issue.outputs.jira_key }}"
          CLEAN_TITLE=$(echo "${{ steps.issue.outputs.title }}" | sed 's/^\[[A-Z][A-Z0-9]*-[0-9]\+\][[:space:]]*//')
          if [ -n "$JIRA_KEY" ]; then
            HEADER="🤖 **AI-Generated Fix — Refs:${JIRA_KEY} - ${CLEAN_TITLE}**"
          else
            HEADER="🤖 **AI-Generated Fix**"
          fi
          COMMENT=$(printf '%s\n\n**Analysis:** %s\n\n**Pull Request:** %s\n\nOnce merged, this GitHub issue and the linked Jira issue will be automatically closed.' \
            "$HEADER" "$ANALYSIS" "${{ steps.create_pr.outputs.pr_url }}")

          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.issue.outputs.number }}/comments" \
            -d "$(jq -n --arg body "$COMMENT" '{"body": $body}')"

      - name: Comment when no changes were produced
        if: steps.check_changes.outputs.has_changes == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.issue.outputs.number }}/comments" \
            -d '{"body":"🤖 **AI Analysis Complete** — No code changes were identified for this issue. Provide more detail or use `/fix-ai <extra context>` to give the AI more guidance."}'
