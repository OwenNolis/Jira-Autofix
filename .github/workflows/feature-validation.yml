name: Feature Validation (Copilot)

# Triggered by PR comments:
#   /validate-feature-012                          → changed files only, FA/TA from docs/
#   /validate-feature-012 --full                   → full codebase, FA/TA from docs/
#   /validate-feature-012 [fa.md](URL) [ta.md](URL)  → use attached files instead of docs/
#
# If FA and TA markdown files are attached to the comment, those are used.
# Otherwise falls back to docs/functional-analysis/ and docs/technical-analysis/.
# Uses Claude Sonnet via GitHub Models — no extra secrets needed.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  validate:
    runs-on: ubuntu-latest

    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/validate-feature-')

    steps:
      - name: Parse command
        id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          FEATURE_NUM="$(echo "$COMMENT" | grep -oP '(?<=/validate-feature-)\S+' | sed 's/--.*$//' | tr -d ' ')"
          echo "Feature token: $FEATURE_NUM"

          if echo "$COMMENT" | grep -q '\-\-full'; then
            MODE="full"
          else
            MODE="changed"
          fi

          # Extract up to 2 attachment URLs (FA = first, TA = second)
          URLS=($(echo "$COMMENT" | grep -oP 'https://github\.com/user-attachments/(?:assets|files)/[^\s\)]+' || true))
          FA_URL="${URLS[0]:-}"
          TA_URL="${URLS[1]:-}"

          echo "feature_num=$FEATURE_NUM" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"               >> "$GITHUB_OUTPUT"
          echo "fa_url=$FA_URL"           >> "$GITHUB_OUTPUT"
          echo "ta_url=$TA_URL"           >> "$GITHUB_OUTPUT"
          echo "Mode: $MODE | FA URL: ${FA_URL:-none} | TA URL: ${TA_URL:-none}"

      - name: Post reaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST \
            "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1' || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve FA and TA
        id: docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEATURE_NUM: ${{ steps.parse.outputs.feature_num }}
          FA_URL: ${{ steps.parse.outputs.fa_url }}
          TA_URL: ${{ steps.parse.outputs.ta_url }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/docs

          # ── FA ─────────────────────────────────────────────────────────────────
          if [ -n "$FA_URL" ]; then
            echo "📥 Downloading FA from attachment..."
            curl -sS -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$FA_URL" \
              -o /tmp/docs/fa.md
            FA_PATH="/tmp/docs/fa.md"
            echo "  ✅ FA downloaded ($(wc -l < /tmp/docs/fa.md) lines)"
          else
            FA_PATH="$(find docs/functional-analysis -maxdepth 1 -name "feature-${FEATURE_NUM}*.md" 2>/dev/null | head -1 || true)"
            if [ -z "$FA_PATH" ]; then
              gh pr comment "$PR_NUMBER" --body "❌ **Feature Validation failed** — FA not found.

Attach the FA \`.md\` file to the comment, or make sure \`docs/functional-analysis/feature-${FEATURE_NUM}*.md\` exists." || true
              exit 1
            fi
            echo "  ✅ FA from repo: $FA_PATH"
          fi

          # ── TA ─────────────────────────────────────────────────────────────────
          if [ -n "$TA_URL" ]; then
            echo "📥 Downloading TA from attachment..."
            curl -sS -L \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$TA_URL" \
              -o /tmp/docs/ta.md
            TA_PATH="/tmp/docs/ta.md"
            echo "  ✅ TA downloaded ($(wc -l < /tmp/docs/ta.md) lines)"
          else
            TA_PATH="$(find docs/technical-analysis -maxdepth 1 -name "feature-${FEATURE_NUM}*.md" 2>/dev/null | head -1 || true)"
            if [ -z "$TA_PATH" ]; then
              gh pr comment "$PR_NUMBER" --body "❌ **Feature Validation failed** — TA not found.

Attach the TA \`.md\` file to the comment, or make sure \`docs/technical-analysis/feature-${FEATURE_NUM}*.md\` exists." || true
              exit 1
            fi
            echo "  ✅ TA from repo: $TA_PATH"
          fi

          echo "fa_path=$FA_PATH" >> "$GITHUB_OUTPUT"
          echo "ta_path=$TA_PATH" >> "$GITHUB_OUTPUT"

      - name: Get PR changed files
        id: pr_files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.parse.outputs.mode }}
        run: |
          set -euo pipefail

          CHANGED_FILES="$(gh api \
            "/repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --paginate \
            --jq '.[].filename' 2>/dev/null || true)"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          DIFF_CONTENT=""
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              EXT="${file##*.}"
              case "$EXT" in
                java|ts|tsx|js|jsx|sql|yaml|yml|json|xml|properties)
                  DIFF_CONTENT="${DIFF_CONTENT}\n\n### File: ${file}\n\`\`\`\n$(head -200 "$file")\n\`\`\`"
                  ;;
              esac
            fi
          done <<< "$CHANGED_FILES"

          if [ "$MODE" = "full" ]; then
            while IFS= read -r f; do
              DIFF_CONTENT="${DIFF_CONTENT}\n\n### File: ${f}\n\`\`\`java\n$(head -150 "$f")\n\`\`\`"
            done < <(find backend/src/main -name "*.java" 2>/dev/null)
            while IFS= read -r f; do
              DIFF_CONTENT="${DIFF_CONTENT}\n\n### File: ${f}\n\`\`\`typescript\n$(head -150 "$f")\n\`\`\`"
            done < <(find frontend/src \( -name "*.tsx" -o -name "*.ts" \) 2>/dev/null)
          fi

          printf "%b" "$DIFF_CONTENT" > /tmp/code_context.txt

          echo "changed_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED_FILES"     >> "$GITHUB_OUTPUT"
          echo "EOF"                >> "$GITHUB_OUTPUT"

      - name: Run Claude feature validation
        id: validation
        env:
          GH_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_MODEL:  ${{ vars.CLAUDE_MODEL }}
          FA_PATH:       ${{ steps.docs.outputs.fa_path }}
          TA_PATH:       ${{ steps.docs.outputs.ta_path }}
          MODE:          ${{ steps.parse.outputs.mode }}
          FEATURE_NUM:   ${{ steps.parse.outputs.feature_num }}
          PR_NUMBER:     ${{ github.event.issue.number }}
          REPO:          ${{ github.repository }}
        run: |
          set -euo pipefail

          MODEL="${CLAUDE_MODEL:-claude-sonnet-4-5}"

          FA_CONTENT="$(cat "$FA_PATH")"
          TA_CONTENT="$(cat "$TA_PATH")"
          CODE_CONTEXT="$(head -c 80000 /tmp/code_context.txt)"

          PR_TITLE="$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.title' || true)"
          PR_BODY="$(gh api  "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""' || true)"

          MODE_LABEL="changed files only"
          [ "$MODE" = "full" ] && MODE_LABEL="full codebase"

          PROMPT="You are an expert software engineer doing a feature compliance review.

          You are given:
          1. A Functional Analysis (FA) document describing the feature requirements
          2. A Technical Analysis (TA) document describing the technical design
          3. Code context from the PR (${MODE_LABEL})

          Your task: validate whether the PR code correctly implements the feature described in the FA and TA.

          ═══════════════════════════════════════
          FUNCTIONAL ANALYSIS (FA)
          ═══════════════════════════════════════
          ${FA_CONTENT}

          ═══════════════════════════════════════
          TECHNICAL ANALYSIS (TA)
          ═══════════════════════════════════════
          ${TA_CONTENT}

          ═══════════════════════════════════════
          CODE CONTEXT (${MODE_LABEL})
          ═══════════════════════════════════════
          PR Title: ${PR_TITLE}
          PR Description: ${PR_BODY}

          ${CODE_CONTEXT}

          ═══════════════════════════════════════
          VALIDATION INSTRUCTIONS
          ═══════════════════════════════════════
          Write a structured Markdown validation report with these exact sections:

          ## 📋 FA Validation

          ### Requirements
          For each REQ-xxx found in the FA: ✅ implemented / ❌ missing / ⚠️ partial — with a short reason.

          ### Business Rules
          For each BR-xxx found in the FA: ✅ enforced / ❌ missing / ⚠️ partial — with a short reason.

          ### Acceptance Criteria
          For each AC-xxx found in the FA: ✅ covered / ❌ not covered / ⚠️ partial — with a short reason.

          ### Non-Functional Requirements
          For each NFR-xxx found in the FA: ✅ addressed / ❌ missing / ⚠️ partial — with a short reason.

          ## 🔧 TA Validation

          ### API Contracts
          Check if the implemented endpoints match the TA (paths, methods, request/response structure, status codes).
          List each endpoint: ✅ correct / ❌ wrong / ⚠️ partial.

          ### Domain Model & Database
          Check if entities, fields, constraints and relations match the TA domain model and ERD.
          List findings per entity.

          ### Backend Design
          Check if the controller/service/repository structure matches the TA backend design.

          ### Frontend Design
          Check if components and routes match the TA frontend design (if applicable to this PR).

          ## 📊 Summary

          | Category | ✅ OK | ⚠️ Partial | ❌ Missing |
          |----------|-------|-----------|---------|
          | Requirements | X | X | X |
          | Business Rules | X | X | X |
          | Acceptance Criteria | X | X | X |
          | NFR | X | X | X |
          | API Contracts | X | X | X |
          | Domain Model | X | X | X |

          ## 🏁 Verdict

          **PASS** / **PARTIAL** / **FAIL** — one sentence overall conclusion.

          Important rules:
          - Be specific: reference exact REQ/BR/AC/NFR numbers and exact field/endpoint names
          - If code is not available for a check, mark it as ⚠️ and state why
          - Do NOT invent requirements — only validate against what is written in FA and TA
          - Keep each bullet concise (1 line max)"

          REQUEST_JSON="$(jq -n --arg model "$MODEL" --arg prompt "$PROMPT" '{
            model: $model,
            messages: [{ role: "user", content: $prompt }],
            temperature: 0,
            max_tokens: 8192
          }')"

          HTTP_CODE="$(curl -sS -o /tmp/claude.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://models.inference.ai.azure.com/chat/completions" \
            -d "$REQUEST_JSON" || true)"

          echo "GitHub Models HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            REPORT="$(jq -r '.choices[0].message.content // ""' /tmp/claude.json)"
          else
            ERROR="$(jq -r '.error.message // "unknown error"' /tmp/claude.json 2>/dev/null || true)"
            REPORT="⚠️ GitHub Models API call failed (HTTP $HTTP_CODE): ${ERROR}. Please retry the validation command."
          fi

          {
            echo "## 🔍 Feature Validation — \`feature-${FEATURE_NUM}\`"
            echo
            echo "> **Mode:** ${MODE_LABEL} | **Model:** ${MODEL}"
            echo
            echo "$REPORT"
            echo
            echo "---"
            echo "_Validation triggered by @${{ github.event.comment.user.login }} · $(date -u '+%Y-%m-%d %H:%M UTC')_"
          } > /tmp/validation-report.md

          gh pr comment "$PR_NUMBER" --body-file /tmp/validation-report.md
