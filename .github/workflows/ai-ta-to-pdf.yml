name: AI — TA to PDF

# Triggered by PR comments:
#   /ta-to-pdf feature-012-my-feature
#   [feature-012-my-feature.md](https://github.com/user-attachments/assets/...)
#
# Drag-drop the TA markdown file into the comment. The workflow downloads it,
# runs ta_to_pdf.py using Chrome headless, uploads the PDF as an artifact,
# and posts a download link in the PR.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ta-to-pdf:
    runs-on: ubuntu-latest

    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ta-to-pdf ')

    steps:
      - name: Parse command
        id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          FEATURE_ID="$(echo "$COMMENT" | grep -oP '(?<=/ta-to-pdf )\S+' | head -1)"
          echo "Feature ID: $FEATURE_ID"

          TA_URL="$(echo "$COMMENT" | grep -oP 'https://github\.com/user-attachments/assets/[^\s\)]+' | head -1 || true)"
          echo "TA URL: $TA_URL"

          echo "feature_id=$FEATURE_ID" >> "$GITHUB_OUTPUT"
          echo "ta_url=$TA_URL"         >> "$GITHUB_OUTPUT"

      - name: Post reaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST \
            "/repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='+1' || true

      - name: Validate inputs
        env:
          FEATURE_ID: ${{ steps.parse.outputs.feature_id }}
          TA_URL: ${{ steps.parse.outputs.ta_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$FEATURE_ID" ]; then
            gh pr comment "$PR_NUMBER" --body "❌ **TA to PDF failed** — could not parse feature ID.
          Expected: \`/ta-to-pdf feature-012-my-feature\`" || true
            exit 1
          fi
          if [ -z "$TA_URL" ]; then
            gh pr comment "$PR_NUMBER" --body "❌ **TA to PDF failed** — no TA file attachment found.
          Please drag-drop the TA \`.md\` file into your comment alongside the command." || true
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet markdown pillow python-dotenv

      - name: Download TA markdown
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TA_URL: ${{ steps.parse.outputs.ta_url }}
          FEATURE_ID: ${{ steps.parse.outputs.feature_id }}
        run: |
          mkdir -p /tmp/ta-input /tmp/pdf-output
          curl -sS -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$TA_URL" \
            -o "/tmp/ta-input/${FEATURE_ID}.md"
          echo "Downloaded TA: $(wc -l < /tmp/ta-input/${FEATURE_ID}.md) lines"

      - name: Convert TA to PDF
        env:
          FEATURE_ID: ${{ steps.parse.outputs.feature_id }}
        run: |
          python ai/agent/langgraph/ta_to_pdf.py \
            "$FEATURE_ID" \
            --input-dir /tmp/ta-input \
            --output-dir /tmp/pdf-output

      - name: Post result comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          FEATURE_ID: ${{ steps.parse.outputs.feature_id }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          PDF_FILE="/tmp/pdf-output/${FEATURE_ID}.pdf"

          if [ ! -f "$PDF_FILE" ]; then
            gh pr comment "$PR_NUMBER" --body "❌ **TA to PDF failed** — PDF output not found." || true
            exit 1
          fi

          PDF_SIZE="$(du -sh "$PDF_FILE" | cut -f1)"
          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M UTC')"

          cat > /tmp/pdf-comment.md << EOF
          ## 📑 TA PDF — \`${FEATURE_ID}\`

          ✅ PDF generated successfully (**${PDF_SIZE}**).

          **Download:** Go to the [Actions run](https://github.com/${REPO}/actions/runs/${RUN_ID}) and download the \`ta-pdf-${FEATURE_ID}\` artifact.

          ---
          _Generated by @${ACTOR} · ${TIMESTAMP}_
          EOF

          gh pr comment "$PR_NUMBER" --body-file /tmp/pdf-comment.md

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ta-pdf-${{ steps.parse.outputs.feature_id }}
          path: /tmp/pdf-output/
          retention-days: 30
